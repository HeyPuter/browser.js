<!doctype html>
<html>
	<head>
		<title>Bare Test Harness (no scramjet)</title>
	</head>
	<body>
		<h1>Bare Test Harness</h1>
		<div id="status">Initializing...</div>
		<iframe
			id="testframe"
			style="width: 100%; height: 80vh; border: 1px solid #ccc"
		></iframe>

		<script>
			const statusEl = document.getElementById("status");
			const testframe = document.getElementById("testframe");

			statusEl.textContent = "Ready - waiting for test...";

			window.__runwayNavigate = (url) => {
				statusEl.textContent = `Loading test: ${url}`;
				// Use direct iframe src - no proxy
				testframe.src = url;
			};

			// sbxdiff: the target may be base64 so it does not appear literally
			// in this page's URL. --sbxdiff-virtual-time-after matches on a URL
			// substring, and an embedded copy of the target made THIS page match
			// as the guest realm -- turning virtual time on during bootstrap,
			// which is exactly what the deferral exists to avoid.
			const sbxdiffTarget = (h) =>
				h.startsWith("b64:") ? atob(h.slice(4)) : decodeURIComponent(h);

			// sbxdiff: drive from the URL so a run needs no CDP session.
			if (location.hash.length > 1) {
				window.__runwayNavigate(sbxdiffTarget(location.hash.slice(1)));
			}

			console.log("Bare harness ready, __runwayNavigate exposed");
		</script>
	</body>
</html>
