		<script>
			// Standards mode or quirks mode.
			//
			// `document.compatMode` is one string, and everything about layout hangs
			// off it. Measured on rateyourmusic: the oracle reported "CSS1Compat" and
			// the sandbox "BackCompat", which took `documentElement.clientHeight` from
			// 813 to 15364 and moved `scrollHeight`, `HTMLCollection.length` and
			// `IntersectionObserverEntry.isIntersecting` with it -- all of which an
			// anti-bot payload records.
			//
			// The shape here copies rateyourmusic's own opening on purpose: the DOCTYPE,
			// then a newline, then `<html>` with attributes, then a head whose first
			// content is whitespace and a <link>. Anything a rewriter inserts BEFORE the
			// DOCTYPE puts the parser in quirks mode, and where it chooses to inject
			// depends on what the head starts with.
			const say = (k, v) => {
				document.title = k + "=" + String(v);
			};

			// Navigate once, then report. The page under test on rateyourmusic is
			// not the one the run starts on: Cloudflare's challenge commits first
			// and the real page arrives by NAVIGATION, with `$rfp`/`$io` on its
			// proxy URL. That document came out in quirks mode where the oracle's
			// was in standards, so whether a navigated-to document keeps its
			// DOCTYPE is the thing to check, and a fresh top-level load is not it.
			if (!location.search) {
				location.href = location.pathname + "?navigated=1";
			} else {
				say("doc.viaNavigation", true);
			}
			say("doc.compatMode", document.compatMode);
			say("doc.doctype", document.doctype ? document.doctype.name : "none");
			say(
				"doc.firstChildType",
				document.firstChild ? document.firstChild.nodeType : "none"
			);
			say(
				"doc.firstChildName",
				document.firstChild ? document.firstChild.nodeName : "none"
			);
			say("doc.documentElementTag", document.documentElement.tagName);
			say("doc.htmlLang", document.documentElement.lang);
			say("doc.htmlClass", document.documentElement.className);
			say("doc.clientHeight", document.documentElement.clientHeight);
			say("doc.scrollHeight", document.documentElement.scrollHeight);
			say(
				"doc.headFirstChild",
				document.head.firstChild ? document.head.firstChild.nodeName : "none"
			);
			say("doc.bodyChildCount", document.body.children.length);
			// Script visibility on THIS path specifically. The quirky path injects
			// at the document root rather than into <head>, and a filter that hides
			// the shim's scripts has to cover both -- measured on rateyourmusic,
			// which takes the quirky path, `getElementsByTagName("script")` was 23
			// long in the sandbox and 20 in the oracle.
			say("doc.scriptsByTag", document.getElementsByTagName("script").length);
			say("doc.documentScripts", document.scripts.length);
			say("doc.scriptsQSA", document.querySelectorAll("script").length);
			say(
				"doc.rootChildren",
				document.documentElement.parentNode.childNodes.length
			);
		</script>

</html>
<!-- Trailing content AFTER </html>, which is what real pages have and what
     pushes the rewriter down its "quirky document structure" path. That path
     used to inject its scripts at position 0 of the document -- in front of
     the DOCTYPE -- which is precisely what makes a browser ignore it. The
     probe asserts the DOCTYPE survives injection. -->
<div id="trailing">after</div>
