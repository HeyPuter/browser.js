<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>sbxdiff Navigation API probe</title>
	</head>
	<body>
		<script>
			// Is the Navigation API there, and does being FRAMED decide it?
			//
			// `globals.html` measured the guest's global surface seven names
			// short under the proxy, and the seven are the whole Navigation API:
			//
			//   navigation, NavigateEvent, NavigationActivation,
			//   NavigationCurrentEntryChangeEvent, NavigationDestination,
			//   NavigationHistoryEntry, NavigationTransition
			//
			// That list is guest-readable and Cloudflare enumerates `window`, so
			// it is in the payload. The question this page answers is WHY: the
			// sandbox's guest is an iframe and the oracle's is the top document,
			// so "the proxy hides it" and "a frame does not have it" predict the
			// same divergence. Here both are measured in one document, so the
			// two answers come apart.
			const say = (k, v) => {
				document.title = k + "=" + String(v);
			};

			const NAMES = [
				"navigation",
				"NavigateEvent",
				"NavigationActivation",
				"NavigationCurrentEntryChangeEvent",
				"NavigationDestination",
				"NavigationHistoryEntry",
				"NavigationTransition",
			];

			const present = (w) => {
				try {
					return NAMES.filter((n) => n in w).join(",");
				} catch (e) {
					return "threw:" + (e && e.name);
				}
			};

			say("nav.top", present(window));
			say("nav.topType", typeof window.navigation);
			say(
				"nav.proto",
				Object.getPrototypeOf(window.navigation).constructor.name
			);

			// The URLs the API reports. `navigation` was deleted rather than
			// shimmed for a reason -- a navigation driven through it is a
			// navigation the proxy has to rewrite -- so the shim has to hold
			// on both sides of that: what it REPORTS is the site's URL, and
			// what it NAVIGATES TO is the proxy's.
			say("nav.entryUrl", JSON.stringify(navigation.currentEntry.url));
			say(
				"nav.entryUrls",
				JSON.stringify(navigation.entries().map((e) => e.url))
			);
			say("nav.canBack", navigation.canGoBack);
			say("nav.canForward", navigation.canGoForward);
			say("nav.entryProto", navigation.currentEntry.constructor.name);

			// A same-document navigation, which is safe to actually perform:
			// the `navigate` event carries a NavigationDestination, and that
			// is the second place a URL surfaces.
			navigation.addEventListener("navigate", (e) => {
				say("nav.destUrl", JSON.stringify(e.destination.url));
				say("nav.destSame", e.destination.sameDocument);
				say("nav.navType", e.navigationType);
			});
			try {
				const r = navigation.navigate("#sbxdiff");
				say("nav.result", Object.keys(r).sort().join(","));
				r.finished.then(
					() => {
						say("nav.finished", "ok");
						say("nav.afterUrl", JSON.stringify(navigation.currentEntry.url));
						say("nav.afterHref", JSON.stringify(location.href));
					},
					(e) => say("nav.finishedThrew", e && e.name)
				);
			} catch (e) {
				say("nav.navigateThrew", (e && e.name) + ":" + (e && e.message));
			}

			// And a cross-document one, in a frame so the run survives it.
			const g = document.createElement("iframe");
			g.src = "/navgo.html";
			g.addEventListener("load", () => {
				let where = "unreadable";
				try {
					where = JSON.stringify(g.contentWindow.location.href);
				} catch (e) {
					where = "threw:" + e.name;
				}
				say("nav.goWhere", where);
			});
			document.body.appendChild(g);

			const f = document.createElement("iframe");
			f.src = "about:blank";
			f.addEventListener("load", () => {
				try {
					say("nav.frame", present(f.contentWindow));
					say("nav.frameType", typeof f.contentWindow.navigation);
					// And whether the frame agrees with its parent, which is the
					// comparison that does not depend on which side runs framed.
					say(
						"nav.frameMatchesTop",
						present(f.contentWindow) === present(window)
					);
				} catch (e) {
					say("nav.frameThrew", e && e.name);
				}
			});
			document.body.appendChild(f);
		</script>
	</body>
</html>
