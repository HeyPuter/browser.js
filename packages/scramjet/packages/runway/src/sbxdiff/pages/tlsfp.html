<!doctype html>
<!--
  What does this side's TLS handshake look like from the outside?

  LIVE ONLY, and never a differ input: it reaches the real internet, so it has
  no store and no baseline. `serve.ts --wisp --page tlsfp.html --open sandbox`
  reports epoxy's handshake; `--open oracle` reports Chromium's own, which is
  the thing epoxy has to be made to look like.

  A Cloudflare managed challenge binds the clearance it issues to the client
  that earned it, and the strongest part of that binding is below HTTP -- so
  the sandbox can solve the challenge, be handed a `cf_clearance`, present it
  on the next request and still be answered 403. Measured on rateyourmusic,
  that is exactly what happens. These are the numbers that say why.

  tls.peet.ws sends no `Access-Control-Allow-Origin`, which does not matter in
  the sandbox (scramjet's service worker hands the response to the page itself)
  and does matter in the oracle. check.ja3.zone sends `*`, so the oracle has at
  least a JA3 to compare even when the richer endpoint is refused.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<title>tls fingerprint</title>
	</head>
	<body>
		<pre id="out">fetching...</pre>
		<script>
			const out = document.getElementById("out");
			const show = (label, text) => {
				out.textContent += `\n=== ${label}\n${text}\n`;
				// CHUNKED, because the interesting part is at the end.
				//
				// The run is read out of Chromium's stderr and a console line
				// does not survive whole: the full peet record arrived cut to
				// 332 characters, which is enough for the ja3 summary and stops
				// short of `http2`. That is where the Akamai fingerprint and the
				// sent header ORDER are, and header order is exactly the kind of
				// thing this page exists to compare. So: 400 characters per
				// line, numbered, reassembled by whoever is reading.
				const flat = text.replace(/\s+/g, " ");
				const CHUNK = 400;
				const total = Math.ceil(flat.length / CHUNK) || 1;
				for (let i = 0; i < total; i++) {
					console.info(
						`sbxdiff-tlsfp ${label} ${i}/${total} ${flat.slice(i * CHUNK, (i + 1) * CHUNK)}`
					);
				}
			};

			(async () => {
				out.textContent = "";
				try {
					const r = await fetch("https://tls.peet.ws/api/all");
					const d = await r.json();
					const tls = d.tls || {};
					show(
						"peet",
						JSON.stringify({
							http_version: d.http_version,
							ja3: tls.ja3,
							ja3_hash: tls.ja3_hash,
							ja4: tls.ja4,
							peetprint_hash: tls.peetprint_hash,
							akamai: (d.http2 || {}).akamai_fingerprint,
						})
					);
					// The full record, for the parts a hash throws away: which
					// extensions were sent, in what order, with what contents.
					show("peet-full", JSON.stringify(d));
				} catch (e) {
					show("peet", `FAILED ${e}`);
				}

				try {
					const r = await fetch("https://check.ja3.zone/");
					show("ja3zone", JSON.stringify(await r.json()));
				} catch (e) {
					show("ja3zone", `FAILED ${e}`);
				}

				// browserleaks sends `Access-Control-Allow-Origin: *`, which is
				// what makes it the only rich endpoint BOTH sides can read.
				//
				// tls.peet.ws sends none, so the oracle's fetch of it is refused
				// and the only comparison available was the sandbox's record
				// against a Chromium NAVIGATION captured separately -- and those
				// differ in Chrome too (`upgrade-insecure-requests`,
				// `sec-fetch-user`, and the position of `accept`). Header order
				// is the thing being compared here, so the two captures have to
				// be the same kind of request.
				// Same-origin, so BOTH sides can read it, and the same kind of
				// request for both -- which is what the public endpoints could
				// not give. See `/__sbxdiff/headers` in serve.ts.
				try {
					const r = await fetch("/__sbxdiff/headers");
					show("hdrorder", JSON.stringify(await r.json()));
				} catch (e) {
					show("hdrorder", `FAILED ${e}`);
				}

				// And a POST carrying a cookie and a content type, because that
				// is the request the challenge actually makes: the `/fo/` calls
				// are POSTs with `cf_clearance` on them, and a browser orders a
				// POST's headers differently from a GET's -- `content-type`,
				// `origin` and `cookie` only exist on this one.
				try {
					document.cookie = "sbxdiff_order=1; path=/";
					const r = await fetch("/__sbxdiff/headers", {
						method: "POST",
						body: "x=1",
						headers: { "content-type": "application/x-www-form-urlencoded" },
					});
					show("hdrpost", JSON.stringify(await r.json()));
				} catch (e) {
					show("hdrpost", `FAILED ${e}`);
				}

				try {
					const r = await fetch("https://tls.browserleaks.com/json");
					show("browserleaks", JSON.stringify(await r.json()));
				} catch (e) {
					show("browserleaks", `FAILED ${e}`);
				}
			})();
		</script>
	</body>
</html>
