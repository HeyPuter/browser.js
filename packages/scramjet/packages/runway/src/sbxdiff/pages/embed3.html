<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>embed3 probe</title>
	</head>
	<body>
		<div id="host"></div>
		<script>
			// Cloudflare's Turnstile shape, one step further than embed.html: the
			// parent reads `iframe.contentWindow` and posts into the frame WHILE
			// the frame is still loading, repeatedly. Scramjet's `contentWindow`
			// trap hooks a subcontext on first read, and this asks whether doing
			// that mid-parse destroys the document the frame is in the middle of
			// building.
			const say = (k, v) => {
				document.title = k + "=" + String(v);
			};
			addEventListener("message", (e) => {
				if (!e.data || e.data.probe !== "embedded") return;
				say("embed3.heard", e.data.value);
			});
			const root = document
				.getElementById("host")
				.attachShadow({ mode: "open" });
			const f = document.createElement("iframe");
			f.src = "/embedded.html";
			f.id = "cf-chl-widget-probe";
			root.appendChild(f);
			// Immediately, and then on a timer, exactly like the widget watchdog.
			let posts = 0;
			const poke = () => {
				try {
					f.contentWindow.postMessage({ probe: "poke", n: posts++ }, "*");
				} catch (e) {
					say("embed3.poke", "threw:" + e.name);
				}
			};
			poke();
			for (let i = 1; i <= 8; i++) setTimeout(poke, i * 200);
			say("embed3.created", f.src);
			document.title = "sbxdiff:done";
		</script>
	</body>
</html>
