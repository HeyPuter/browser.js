<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>inner</title>
	</head>
	<body>
		<script>
			// A child frame: its view of its own and its parent's identity is a
			// surface the sandbox has to get right too.
			const say = (k, v) => {
				document.title = k + "=" + String(v);
			};
			say("inner.href", location.href);
			say("inner.origin", location.origin);
			say("inner.top_is_self", top === self);
			say("inner.parentIsSelf", parent === self);

			// Posts to the PARENT, and separately records whether the message
			// also came back to this frame. A shim that drops the receiver on
			// the way to the native posts to its own global instead, and the
			// parent simply never hears from the frame.
			addEventListener("message", (e) => {
				if (!e.data || e.data.probe !== "inner") return;
				say("inner.self_echo", true);
			});
			parent.postMessage({ probe: "inner", value: "hello" }, "*");

			document.title = "inner:done";
		</script>
	</body>
</html>
